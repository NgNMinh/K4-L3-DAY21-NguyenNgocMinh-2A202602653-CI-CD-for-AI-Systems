name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cicd.yml'
      - 'data/**.dvc'
      - 'requirements.txt'
      - 'src/**.py'
      - 'tests/**'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure AWS credentials
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json
          import os

          credentials = json.loads(os.environ["STORAGE_CREDENTIALS"])
          required = ("aws_access_key_id", "aws_secret_access_key")
          missing = [name for name in required if not credentials.get(name)]
          if missing:
              raise SystemExit(
                  "STORAGE_CREDENTIALS is missing: " + ", ".join(missing)
              )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  f"AWS_ACCESS_KEY_ID={credentials['aws_access_key_id']}\n"
              )
              env_file.write(
                  f"AWS_SECRET_ACCESS_KEY={credentials['aws_secret_access_key']}\n"
              )
          PY

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json
          import os

          with open("outputs/report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"f1={report['f1_score']}\n")
          PY

      - name: Upload model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import boto3

          bucket = os.environ["ARTIFACT_BUCKET"]
          boto3.client("s3").upload_file(
              "models/model.joblib",
              bucket,
              "artifacts/current/model.joblib",
          )
          print(f"Uploaded model to s3://{bucket}/artifacts/current/model.joblib")
          PY

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check F1 threshold
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os

          f1 = float(os.environ["F1_SCORE"])
          if f1 < 0.65:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < 0.65. Deployment cancelled."
              )
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Proceeding to deployment.")
          PY

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Restart API and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            sudo systemctl restart income-api
            attempt=1
            while [ "$attempt" -le 10 ]; do
              if curl -fsS http://localhost:8080/healthz; then
                echo
                echo "Health check passed."
                exit 0
              fi
              echo "Health check attempt $attempt failed; retrying in 3 seconds."
              sleep 3
              attempt=$((attempt + 1))
            done
            sudo journalctl -u income-api -n 50 --no-pager || true
            echo "Health check failed after 10 attempts." >&2
            exit 1
